#cloud-config
package_update: true
packages:
  - apache2

write_files:
  - path: /var/www/html/index.html
    owner: root:root
    permissions: "0644"
    defer: true
    content: |
      <!DOCTYPE html>
      <html lang="en">
      <head>
        <meta charset="utf-8">
        <title>Week 7 - OpenTofu</title>
        <style>
          body { font-family: sans-serif; background: #f4f6f8; text-align: center; margin-top: 15vh; }
          h1 { color: #1a4d8f; }
        </style>
      </head>
      <body>
        <h1>${student_name}</h1>
        <p>${page_message}</p>
        <p>This server was built entirely with OpenTofu and cloud-init.</p>
      </body>
      </html>

runcmd:
  - systemctl enable --now apache2